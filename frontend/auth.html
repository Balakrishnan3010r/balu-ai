<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #212121;
            color: #ececec;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }

        .logo-wrap {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6c47ff, #a78bff);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        .card {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #333;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #212121;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: #ececec;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #555;
        }

        input:focus {
            border-color: #6c47ff;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #fff;
            color: #111;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .btn:hover {
            background: #e8e8e8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-google {
            width: 100%;
            padding: 13px;
            background: #fff;
            color: #111;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-google:hover {
            background: #e8e8e8;
        }

        .btn-google:active {
            transform: scale(0.98);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider-text {
            font-size: 12px;
            color: #666;
        }

        .switch-text {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }

        .switch-text a {
            color: #a78bff;
            text-decoration: none;
            font-weight: 500;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background: #3a1a1a;
            border: 1px solid #ff444444;
            color: #ff8888;
        }

        .alert-success {
            background: #1a3a1a;
            border: 1px solid #44ff4444;
            color: #88ff88;
        }

        .forgot-link {
            text-align: right;
            font-size: 13px;
            color: #a78bff;
            cursor: pointer;
            margin-top: -8px;
            margin-bottom: 10px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .otp-input {
            text-align: center !important;
            font-size: 28px !important;
            font-weight: 700 !important;
            letter-spacing: 10px;
            color: #a78bff !important;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="logo-wrap">
            <div class="logo-icon">⚡</div>
            <div class="logo-title">Aura AI</div>
            <div class="logo-sub">Your personal AI assistant</div>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- LOGIN -->
        <div id="screenLogin">
            <div class="card">
                <div class="card-title">Welcome back</div>

                <!-- Google Login -->
                <button class="btn-google" onclick="loginWithGoogle()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Continue with Google
                </button>

                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">or</div>
                    <div class="divider-line"></div>
                </div>

                <div class="form-group">
                    <input type="text" id="loginName" placeholder="Username" autocomplete="username" />
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
                </div>
                <div class="forgot-link" onclick="showScreen('forgot')">Forgot password?</div>
                <button class="btn" id="loginBtn" onclick="login()">Sign in</button>
            </div>
            <div class="switch-text">
                Don't have an account? <a href="#" onclick="showScreen('register')">Sign up</a>
            </div>
        </div>

        <!-- REGISTER -->
        <div id="screenRegister" style="display:none;">
            <div class="card">
                <div class="card-title">Create account</div>

                <!-- Google Register -->
                <button class="btn-google" onclick="loginWithGoogle()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Sign up with Google
                </button>

                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">or</div>
                    <div class="divider-line"></div>
                </div>

                <div class="form-group">
                    <input type="text" id="regName" placeholder="Username" autocomplete="username" />
                </div>
                <div class="form-group">
                    <input type="tel" id="regPhone" placeholder="Phone number (10 digits)" maxlength="10" />
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Password (min 6 chars)"
                        autocomplete="new-password" />
                </div>
                <button class="btn" id="registerBtn" onclick="register()">Create account</button>
            </div>
            <div class="switch-text">
                Already have an account? <a href="#" onclick="showScreen('login')">Log in</a>
            </div>
        </div>

        <!-- FORGOT PASSWORD -->
        <div id="screenForgot" style="display:none;">
            <div class="card">
                <div class="card-title">Reset Password</div>
                <div class="form-group">
                    <input type="tel" id="forgotPhone" placeholder="Registered phone number" maxlength="10" />
                </div>
                <button class="btn" id="forgotBtn" onclick="sendForgotOTP()">Send OTP</button>
            </div>
            <div class="switch-text">
                <a href="#" onclick="showScreen('login')">Back to login</a>
            </div>
        </div>

        <!-- RESET PASSWORD -->
        <div id="screenReset" style="display:none;">
            <div class="card">
                <div class="card-title">Enter OTP</div>
                <p style="text-align:center;font-size:13px;color:#888;margin-bottom:20px;">OTP sent to your phone</p>
                <div class="form-group">
                    <input type="text" id="resetOtp" class="otp-input" placeholder="000000" maxlength="6"
                        oninput="this.value=this.value.replace(/\D/g,'')" />
                </div>
                <div class="form-group">
                    <input type="password" id="resetNewPassword" placeholder="New password (min 6 chars)" />
                </div>
                <button class="btn" id="resetBtn" onclick="resetPassword()">Reset Password</button>
            </div>
            <div class="switch-text">
                <a href="#" onclick="showScreen('login')">Back to login</a>
            </div>
        </div>
    </div>

    <script>
        const API = "https://balu-ai.onrender.com/api";
        let forgotPhone = null;

        function showScreen(name) {
            ["login", "register", "forgot", "reset"].forEach(s => {
                const el = document.getElementById("screen" + s.charAt(0).toUpperCase() + s.slice(1));
                if (el) el.style.display = "none";
            });
            document.getElementById("screen" + name.charAt(0).toUpperCase() + name.slice(1)).style.display = "block";
            hideAlert();
        }

        function showAlert(msg, type = "error") {
            const el = document.getElementById("alertBox");
            el.className = `alert alert-${type}`;
            el.textContent = msg;
            el.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }

        function setLoading(btnId, loading, text) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
        }

        function loginWithGoogle() {
            window.location.href = `${API}/auth/google`;
        }

        async function login() {
            const name = document.getElementById("loginName").value.trim();
            const password = document.getElementById("loginPassword").value;
            if (!name || !password) return showAlert("Please fill in all fields");

            setLoading("loginBtn", true, "Signing in...");
            hideAlert();
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    setLoading("loginBtn", false, "Sign in");
                    return showAlert(data.error);
                }
                localStorage.setItem("token", data.token);
                localStorage.setItem("userName", data.name);
                showAlert("Welcome back, " + data.name + "!", "success");
                setTimeout(() => window.location.href = "/", 1000);
            } catch (err) {
                setLoading("loginBtn", false, "Sign in");
                showAlert("Cannot connect to server.");
            }
        }

        async function register() {
            const name = document.getElementById("regName").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const password = document.getElementById("regPassword").value;

            if (!name || !phone || !password) return showAlert("Please fill in all fields");
            if (password.length < 6) return showAlert("Password must be at least 6 characters");
            if (!/^\d{10}$/.test(phone)) return showAlert("Enter valid 10-digit phone number");

            setLoading("registerBtn", true, "Creating account...");
            hideAlert();
            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, phone, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    setLoading("registerBtn", false, "Create account");
                    return showAlert(data.error);
                }
                localStorage.setItem("token", data.token);
                localStorage.setItem("userName", data.name);
                showAlert("Account created! Welcome to Aura AI!", "success");
                setTimeout(() => window.location.href = "/", 1000);
            } catch (err) {
                setLoading("registerBtn", false, "Create account");
                showAlert("Cannot connect to server.");
            }
        }

        async function sendForgotOTP() {
            const phone = document.getElementById("forgotPhone").value.trim();
            if (!/^\d{10}$/.test(phone)) return showAlert("Enter valid 10-digit phone number");

            forgotPhone = phone;
            setLoading("forgotBtn", true, "Sending OTP...");
            hideAlert();
            try {
                const res = await fetch(`${API}/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (!res.ok) {
                    setLoading("forgotBtn", false, "Send OTP");
                    return showAlert(data.error);
                }
                showAlert("OTP sent to your phone!", "success");
                setTimeout(() => showScreen("reset"), 800);
            } catch (err) {
                setLoading("forgotBtn", false, "Send OTP");
                showAlert("Cannot connect to server.");
            }
        }

        async function resetPassword() {
            const otp = document.getElementById("resetOtp").value.trim();
            const newPassword = document.getElementById("resetNewPassword").value;

            if (!otp || otp.length !== 6) return showAlert("Enter the 6-digit OTP");
            if (newPassword.length < 6) return showAlert("Password must be at least 6 characters");

            setLoading("resetBtn", true, "Resetting...");
            hideAlert();
            try {
                const res = await fetch(`${API}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: forgotPhone, otp, newPassword })
                });
                const data = await res.json();
                if (!res.ok) {
                    setLoading("resetBtn", false, "Reset Password");
                    return showAlert(data.error);
                }
                showAlert("Password reset successful! Please login.", "success");
                setTimeout(() => showScreen("login"), 1200);
            } catch (err) {
                setLoading("resetBtn", false, "Reset Password");
                showAlert("Cannot connect to server.");
            }
        }

        // Handle Google OAuth callback token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const googleToken = urlParams.get("token");
        const googleName = urlParams.get("name");
        if (googleToken) {
            localStorage.setItem("token", googleToken);
            localStorage.setItem("userName", googleName);
            window.location.href = "/";
        }

        if (localStorage.getItem("token")) window.location.href = "/";
        if (urlParams.get("tab") === "register") showScreen("register");

        document.addEventListener("keydown", e => {
            if (e.key !== "Enter") return;
            const screens = {
                screenLogin: () => login(),
                screenRegister: () => register(),
                screenForgot: () => sendForgotOTP(),
                screenReset: () => resetPassword()
            };
            for (const [id, fn] of Object.entries(screens)) {
                const el = document.getElementById(id);
                if (el && el.style.display !== "none") { fn(); break; }
            }
        });
    </script>
</body>

</html>
