<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balu AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #212121;
            color: #ececec;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }

        /* Logo */
        .logo-wrap {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6c47ff, #a78bff);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        /* Card */
        .card {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #333;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #212121;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: #ececec;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #555;
        }

        input:focus {
            border-color: #6c47ff;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 13px;
            background: #fff;
            color: #111;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .btn:hover {
            background: #e8e8e8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: #ececec;
            border: 1px solid #3a3a3a;
        }

        .btn-outline:hover {
            background: #333;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider-text {
            font-size: 12px;
            color: #666;
        }

        /* Switch link */
        .switch-text {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }

        .switch-text a {
            color: #a78bff;
            text-decoration: none;
            font-weight: 500;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        /* Alert */
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background: #3a1a1a;
            border: 1px solid #ff444444;
            color: #ff8888;
        }

        .alert-success {
            background: #1a3a1a;
            border: 1px solid #44ff4444;
            color: #88ff88;
        }

        /* Verify screen */
        .verify-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 12px;
        }

        .verify-info {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .verify-info strong {
            color: #fff;
        }

        .code-input {
            text-align: center !important;
            font-size: 28px !important;
            font-weight: 700 !important;
            letter-spacing: 10px;
            color: #a78bff !important;
        }

        .resend {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-top: 14px;
            cursor: pointer;
        }

        .resend:hover {
            color: #a78bff;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Steps indicator */
        .steps {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #333;
            transition: background 0.3s;
        }

        .step-dot.active {
            background: #6c47ff;
            width: 20px;
            border-radius: 3px;
        }

        .step-dot.done {
            background: #19c37d;
        }
    </style>
</head>

<body>

    <div class="page">
        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-icon">⚡</div>
            <div class="logo-title">Balu AI</div>
            <div class="logo-sub">Your personal AI assistant</div>
        </div>

        <!-- Alert -->
        <div id="alertBox" class="alert"></div>

        <!-- ── LOGIN SCREEN ── -->
        <div id="screenLogin">
            <div class="card">
                <div class="card-title">Welcome back</div>
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email" />
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
                </div>
                <button class="btn" id="loginBtn" onclick="login()">Continue</button>
            </div>
            <div class="switch-text">
                Don't have an account? <a href="#" onclick="showScreen('register')">Sign up</a>
            </div>
        </div>

        <!-- ── REGISTER SCREEN ── -->
        <div id="screenRegister" style="display:none;">
            <div class="card">
                <div class="card-title">Create account</div>
                <div class="form-group">
                    <input type="text" id="regName" placeholder="Full name" autocomplete="name" />
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" placeholder="Email address" autocomplete="email" />
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Password (min 6 chars)"
                        autocomplete="new-password" />
                </div>
                <button class="btn" id="registerBtn" onclick="register()">Create account</button>
            </div>
            <div class="switch-text">
                Already have an account? <a href="#" onclick="showScreen('login')">Log in</a>
            </div>
        </div>

        <!-- ── VERIFY SCREEN ── -->
        <div id="screenVerify" style="display:none;">
            <div class="card">
                <div class="verify-icon">📧</div>
                <div class="verify-info">
                    We sent a 6-digit code to<br />
                    <strong id="verifyEmailLabel"></strong>
                </div>
                <div class="form-group">
                    <input type="text" id="verifyCode" class="code-input" placeholder="000000" maxlength="6"
                        oninput="this.value=this.value.replace(/\D/g,'')" />
                </div>
                <button class="btn" id="verifyBtn" onclick="verify()">Verify email</button>
                <div class="resend" onclick="resendCode()">Resend code</div>
            </div>
            <div class="switch-text">
                Wrong email? <a href="#" onclick="showScreen('register')">Go back</a>
            </div>
        </div>

    </div>

    <script>
        const API = "https://balu-ai.onrender.com/api";
        let pendingUserId = null;
        let pendingEmail = null;
        let pendingName = null;
        let pendingPassword = null;

        function showScreen(name) {
            ["login", "register", "verify"].forEach(s => {
                document.getElementById("screen" + s.charAt(0).toUpperCase() + s.slice(1)).style.display = "none";
            });
            document.getElementById("screen" + name.charAt(0).toUpperCase() + name.slice(1)).style.display = "block";
            hideAlert();
        }

        function showAlert(msg, type = "error") {
            const el = document.getElementById("alertBox");
            el.className = `alert alert-${type}`;
            el.textContent = msg;
            el.style.display = "block";
        }

        function hideAlert() {
            document.getElementById("alertBox").style.display = "none";
        }

        function setLoading(btnId, loading, text) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.innerHTML = loading ? `<span class="spinner"></span>${text}` : text;
        }

        async function login() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            if (!email || !password) return showAlert("Please fill in all fields");

            setLoading("loginBtn", true, "Signing in...");
            hideAlert();

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    setLoading("loginBtn", false, "Continue");
                    return showAlert(data.error);
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("userName", data.name);
                localStorage.setItem("userEmail", data.email);
                showAlert("Welcome back, " + data.name + "! Redirecting...", "success");
                setTimeout(() => window.location.href = "/", 1000);

            } catch (err) {
                setLoading("loginBtn", false, "Continue");
                showAlert("Cannot connect to server. Is it running?");
            }
        }

        async function register() {
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;

            if (!name || !email || !password) return showAlert("Please fill in all fields");
            if (password.length < 6) return showAlert("Password must be at least 6 characters");
            if (!email.includes("@")) return showAlert("Please enter a valid email");

            setLoading("registerBtn", true, "Creating account...");
            hideAlert();

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    setLoading("registerBtn", false, "Create account");
                    return showAlert(data.error);
                }

                pendingUserId = data.userId;
                pendingEmail = email;
                pendingName = name;
                pendingPassword = password;

                document.getElementById("verifyEmailLabel").textContent = email;
                showAlert("Code sent! Check your inbox.", "success");
                setTimeout(() => showScreen("verify"), 800);

            } catch (err) {
                setLoading("registerBtn", false, "Create account");
                showAlert("Cannot connect to server. Is it running?");
            }
        }

        async function verify() {
            const code = document.getElementById("verifyCode").value.trim();
            if (!code || code.length !== 6) return showAlert("Enter the 6-digit code from your email");

            setLoading("verifyBtn", true, "Verifying...");
            hideAlert();

            try {
                const res = await fetch(`${API}/auth/verify`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: pendingUserId, code })
                });
                const data = await res.json();

                if (!res.ok) {
                    setLoading("verifyBtn", false, "Verify email");
                    return showAlert(data.error);
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("userName", data.name);
                localStorage.setItem("userEmail", data.email);
                showAlert("✅ Verified! Welcome to Balu AI!", "success");
                setTimeout(() => window.location.href = "/", 1200);

            } catch (err) {
                setLoading("verifyBtn", false, "Verify email");
                showAlert("Cannot connect to server.");
            }
        }

        async function resendCode() {
            if (!pendingEmail) return showAlert("Please register first");
            showAlert("Sending new code...", "success");
            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: pendingName, email: pendingEmail, password: pendingPassword })
                });
                const data = await res.json();
                pendingUserId = data.userId;
                showAlert("New code sent! Check your inbox.", "success");
            } catch (err) {
                showAlert("Could not resend code.");
            }
        }

        // Enter key support
        document.addEventListener("keydown", e => {
            if (e.key !== "Enter") return;
            const login = document.getElementById("screenLogin");
            const reg = document.getElementById("screenRegister");
            const ver = document.getElementById("screenVerify");
            if (login.style.display !== "none") loginFn();
            else if (reg.style.display !== "none") register();
            else if (ver.style.display !== "none") verify();
        });

        // Check if already logged in
        if (localStorage.getItem("token")) {
            window.location.href = "/";
        }
        // Auto switch to register tab if URL has ?tab=register
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("tab") === "register") {
            showScreen("register");
        }
    </script>
</body>

</html>
