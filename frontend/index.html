<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura AI</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <button class="icon-btn" id="hamburgerBtn" aria-label="Menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <button class="icon-btn" id="newChatBtn" title="New Chat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <path d="M12 5v14M5 12h14" />
                </svg>
            </button>
        </div>

        <div class="sidebar-history">
            <p class="history-label">Recent Chats</p>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-footer"></div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
        <div class="topbar">
            <button class="hamburger" id="hamburgerBtn2" aria-label="Menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>
            <span class="model-badge">⚡ Llama 3.3 · 70B</span>
            <div style="width:36px;"></div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-logo">⚡</div>
                <h1>How can I help you?</h1>
                <div class="suggestion-chips">
                    <div class="chip" onclick="useChip(this)">Explain machine learning</div>
                    <div class="chip" onclick="useChip(this)">What is Generative AI?</div>
                    <div class="chip" onclick="useChip(this)">Help me with my resume</div>
                    <div class="chip" onclick="useChip(this)">What is data mining?</div>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="file-preview" id="filePreview" style="display:none;">
                <div class="file-preview-inner" id="filePreviewInner"></div>
                <button class="remove-file" id="removeFile">✕</button>
            </div>

            <div class="input-box">
                <label class="upload-btn" title="Upload image or document">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                    <input type="file" id="fileInput" accept="image/*,.pdf,.txt" hidden />
                </label>

                <textarea id="userInput" placeholder="Message Aura AI..." rows="1"></textarea>

                <button id="sendBtn" title="Send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
            <p class="disclaimer">Aura AI can make mistakes. Supports images & PDFs.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
