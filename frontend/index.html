<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura AI</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo">⚡ Aura AI</div>
            <button id="newChatBtn" class="new-chat-btn">+ New Chat</button>
        </div>
        <div class="sidebar-history">
            <p class="history-label">Recent Chats</p>
            <div id="historyList"></div>
        </div>
        <div class="sidebar-footer">
            <div class="user-pill">
                <div class="user-avatar-sm">B</div>
                <span>Aura</span>
            </div>
        </div>
    </div>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
        <div class="topbar">
            <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <span class="model-badge">⚡ Llama 3.3 · 70B</span>
            <div style="width:36px;"></div>>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-icon">⚡</div>
                <h1>How can I help you,buddy?</h1>
                <p>Ask anything or upload an image / document</p>
                <div class="suggestion-chips">
                    <div class="chip" onclick="useChip(this)">Explain machine learning</div>
                    <div class="chip" onclick="useChip(this)">What is Generative AI?</div>
                    <div class="chip" onclick="useChip(this)">Help me with my resume</div>
                    <div class="chip" onclick="useChip(this)">What is data mining?</div>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <!-- File preview -->
            <div class="file-preview" id="filePreview" style="display:none;">
                <div class="file-preview-inner" id="filePreviewInner"></div>
                <button class="remove-file" id="removeFile">✕</button>
            </div>

            <div class="input-box">
                <!-- Upload button -->
                <label class="upload-btn" title="Upload image or document">
                    📎
                    <input type="file" id="fileInput" accept="image/*,.pdf,.txt" hidden />
                </label>

                <textarea id="userInput" placeholder="Message Aura AI..." rows="1"></textarea>

                <button id="sendBtn" title="Send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5" />
                        <polyline points="5 12 12 5 19 12" />
                    </svg>
                </button>
            </div>
            <p class="disclaimer">Aura AI can make mistakes. Supports images & PDFs.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
